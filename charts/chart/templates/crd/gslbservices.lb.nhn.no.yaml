{{- if .Values.crd.enable }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.20.1
  name: gslbservices.lb.nhn.no
spec:
  group: lb.nhn.no
  names:
    kind: GSLBService
    listKind: GSLBServiceList
    plural: gslbservices
    singular: gslbservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.global.priority
      name: Priority
      type: integer
    - jsonPath: .status.member.healthy
      name: Healthy
      type: boolean
    - jsonPath: .status.conditions[?(@.type=='Accepted')].status
      name: Accepted
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.member.memberOf
      name: Member-Of
      priority: 1
      type: string
    - jsonPath: .status.member.views
      name: Views
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GSLBService is the Schema for the gslbservices API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of GSLBService
            properties:
              global:
                description: global describes GSLB settings for the service.
                properties:
                  priority:
                    description: priority orders this cluster among members; lower
                      values win.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - priority
                type: object
              member:
                description: member describes this cluster's contribution to the global
                  service.
                properties:
                  healthChecks:
                    description: healthChecks configures how the member's health is
                      determined.
                    properties:
                      failureThreshold:
                        description: failureThreshold is the number of consecutive
                          failures before the member is marked unhealthy.
                        minimum: 1
                        type: integer
                      kind:
                        description: kind is the health check type; derived from targetRef
                          or lua when unset.
                        enum:
                        - HTTPS
                        - TCP-FULL
                        - TCP-HALF
                        - LUA
                        type: string
                      lua:
                        description: lua is an inline Lua health check function.
                        type: string
                      luaRef:
                        description: luaRef references a Lua health check stored in
                          another object.
                        properties:
                          key:
                            description: key is the data key that holds the script.
                            type: string
                          targetRef:
                            description: targetRef is the kind of object holding the
                              script.
                            type: string
                        required:
                        - key
                        - targetRef
                        type: object
                      path:
                        description: path is the URI probed for HTTP-based checks.
                        type: string
                    type: object
                  targetRef:
                    description: targetRef points to the workload this member exposes.
                    properties:
                      kind:
                        description: kind is the type of the referenced object.
                        enum:
                        - HTTPRoute
                        - TCPRoute
                        - Service
                        - Ingress
                        type: string
                      name:
                        description: name is the name of the referenced object.
                        type: string
                      namespace:
                        description: namespace is the referenced object's namespace;
                          defaults to the resource namespace.
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                required:
                - targetRef
                type: object
            required:
            - global
            - member
            type: object
          status:
            description: status defines the observed state of GSLBService
            properties:
              conditions:
                description: conditions represent the current state of the GSLBService
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              member:
                description: member reports the observed state of this cluster's member.
                properties:
                  healthy:
                    description: healthy indicates whether the member currently passes
                      its health checks.
                    type: boolean
                  id:
                    description: id is the operator-generated GSLB service identifier
                      for this member.
                    type: string
                  memberOf:
                    description: memberOf is the global service name this member is
                      delegated under
                    type: string
                  views:
                    description: views is the DNS views the GSLB - service resolves
                      in
                    items:
                      description: View is a network view in which the service is
                        advertised.
                      enum:
                      - inet
                      - hnet
                      type: string
                    type: array
                required:
                - views
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
