# This rule is not used by the project gslb-config-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to gslb.vitistack.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: gslb-config-operator
    app.kubernetes.io/managed-by: kustomize
  name: gslbconfig-viewer-role
rules:
- apiGroups:
  - gslb.vitistack.io
  resources:
  - gslbconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gslb.vitistack.io
  resources:
  - gslbconfigs/status
  verbs:
  - get
