---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - gslb.vitistack.io
  resources:
  - gslbconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gslb.vitistack.io
  resources:
  - gslbconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - gslb.vitistack.io
  resources:
  - gslbconfigs/status
  verbs:
  - get
  - patch
  - update
