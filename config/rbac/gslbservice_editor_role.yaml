# This rule is not used by the project gslb-config-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the lb.nhn.no.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: gslb-config-operator
    app.kubernetes.io/managed-by: kustomize
  name: gslbservice-editor-role
rules:
- apiGroups:
  - lb.nhn.no
  resources:
  - gslbservices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - lb.nhn.no
  resources:
  - gslbservices/status
  verbs:
  - get
