---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-lb-nhn-no-v1alpha1-gslbservice
  failurePolicy: Fail
  name: mgslbservice-v1alpha1.kb.io
  rules:
  - apiGroups:
    - lb.nhn.no
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - gslbservices
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-lb-nhn-no-v1alpha1-gslbservice
  failurePolicy: Fail
  name: vgslbservice-v1alpha1.kb.io
  rules:
  - apiGroups:
    - lb.nhn.no
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - gslbservices
  sideEffects: None
